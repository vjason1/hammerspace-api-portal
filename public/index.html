<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hammerspace API Portal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login -->
<section id="login" class="login" hidden>
  <div class="login-top"><span class="wordmark"><img class="wm-logo" src="img/hammerspace-logo.png" alt="Hammerspace"></span></div>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="login-head"><h1>API Portal</h1><p>Multi-cluster management console</p></div>
    <div><h2 id="lgTitle" class="lg-title">Sign in</h2><p id="lgIntro" class="lg-intro"></p></div>
    <label>Portal user name
      <input id="lgUser" name="username" autocomplete="username" required value="admin">
    </label>
    <label>Password
      <input id="lgPass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <label id="lgConfirmRow" hidden>Confirm password
      <input id="lgPass2" type="password" autocomplete="new-password">
      <span class="lg-intro">At least 8 characters.</span>
    </label>
    <button type="submit" class="btn primary" id="lgSubmit">Sign in</button>
    <p id="lgErr" class="err" role="alert"></p>
  </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <a class="wordmark" href="#sec=dashboard" title="Dashboard"><img class="wm-logo" src="img/hammerspace-logo.png" alt="Hammerspace"><span class="wm-sub">API Portal</span></a>
    <nav class="top-actions">
      <a href="#clusters" class="tb" data-nav="clusters" title="Clusters"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg><span>Clusters</span></a>
      <a href="#objects" class="tb" data-nav="objects" title="Object IDs: names and UUIDs"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 10h4M7 14h7M15.5 10h1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>IDs</span></a>
      <a href="#extract" class="tb" data-nav="extract" title="Extract configuration"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm8 1.5V8h4.5M8 12h8M8 15.5h8M8 19h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Extract</span></a>
      <a href="#audit" class="tb" data-nav="audit" title="Audit log"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18" cy="18" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Audit</span></a>
      <button id="btnHistory" class="tb" type="button" title="Recent requests"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4M12 8v4.5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>History</span></button>
      <a href="#tab=header/events" class="tb tb-ico" title="Notifications"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V9a6 6 0 0 0-6-6zm-2 16a2 2 0 0 0 4 0z"/></svg></a>
      <a href="#tab=header/tasks" class="tb tb-ico" title="Tasks"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2zm2 5v2h6V8zm0 4v2h6v-2zm0 4v2h4v-2z"/></svg></a>
      <details class="usermenu"><summary class="tb tb-ico" title="Account"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg><span id="whoami"></span> ▾</summary>
        <div class="menu"><a href="#users">Portal users</a><button id="btnLogout" type="button">Sign out</button></div></details>
    </nav>
    <div class="switcher" title="Cluster the console works on">
      <label for="clusterSel" class="sw-label">Cluster:</label>
      <div class="sw-row"><span class="dot" id="swDot"></span><select id="clusterSel" aria-label="Active cluster"></select></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <nav class="rail" id="rail" aria-label="Sections"></nav>

  <aside class="sidebar">
    <div class="side-tools">
      <input id="search" type="search" placeholder="Search APIs…  ( / )" aria-label="Search operations">
      <div class="method-filter" id="methodFilter"></div>
      <div class="counts" id="counts"></div>
    </div>
    <nav id="opList" class="op-list"></nav>
  </aside>

  <main id="main" class="main"></main>
</div>

<dialog id="historyDlg" class="dlg">
  <div class="dlg-head"><h3>Recent requests</h3><button class="btn ghost" data-close type="button">Close</button></div>
  <ol id="historyList" class="history"></ol>
</dialog>

<script src="render.js"></script>
<script src="meta.js"></script>
<script src="cli-docs.js"></script>
<script src="cli.js"></script>
<script src="nav.js"></script>
<script src="forms.js"></script>
<script src="extract.js"></script>
<script src="app.js"></script>
<script src="objects.js"></script>
<script src="shell.js"></script>
<script src="clusters.js"></script>
</body>
</html>
