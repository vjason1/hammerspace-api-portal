# Builds the Docker image on every push and pull request, and checks that the server starts.
name: docker-build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in *.js public/*.js; do node --check "$f"; done
      - name: Build image
        run: docker build -t hs-api-portal:ci .
      - name: Smoke test
        run: |
          docker run -d --name portal -p 8080:8080 hs-api-portal:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs portal; exit 1
